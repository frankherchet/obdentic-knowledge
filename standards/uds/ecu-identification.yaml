  - id: uds.f18c.serial_number
    semantic: ecu.serial_number
    version: 1
    description: ECU Serial Number
    operation: { type: uds.read_data_by_identifier, identifier: "0xF18C" }
    response: { positive_service: "0x62", identifier_echo: true }
    decoder: { type: opaque_bytes }
    provenance: *iso14229
    hardware_validation: *standard_support
    notes: >-
      Runtime values are private observed vehicle/ECU inventory and must not be
      promoted into canonical knowledge merely because this standard semantic exists.

