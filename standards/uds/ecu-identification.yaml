schema_version: 1
namespace: uds.identification
description: >-
  Bounded ISO 14229 ReadDataByIdentifier candidates for read-only ECU
  identification. Runtime support is observed independently per ECU instance.

sets:
  - id: uds.standard.ecu_identification
    version: 1
    description: >-
      Standard ECU identification candidates used by bounded discovery.
      F190/VIN is intentionally excluded and remains a separate vehicle-identity concern.
    members:
      - ecu.boot_software_identification
      - ecu.application_software_identification
      - ecu.manufacturer_spare_part_number
      - ecu.manufacturer_software_number
      - ecu.manufacturer_software_version
      - ecu.system_supplier_identifier
      - ecu.manufacturing_date
      - ecu.serial_number
      - ecu.manufacturer_hardware_number
      - ecu.system_supplier_hardware_number
      - ecu.system_supplier_hardware_version
      - ecu.system_supplier_software_number
      - ecu.system_supplier_software_version
      - ecu.system_name

definitions:
  - id: uds.f180.boot_software_identification
    semantic: ecu.boot_software_identification
    version: 1
    description: Boot Software Identification
    operation: { type: uds.read_data_by_identifier, identifier: "0xF180" }
    response: { positive_service: "0x62", identifier_echo: true }
    decoder: { type: opaque_bytes }
    provenance: &iso14229
      classification: VERIFIED
      confidence: high
      sources:
        - kind: standard
          citation: "ISO 14229-1, standardized data identifiers for ReadDataByIdentifier"
          note: "The DID meaning is standardized; payload interpretation may still require supplier/manufacturer knowledge."
    hardware_validation: &standard_support
      status: not_applicable
      note: "Canonical DID meaning does not imply that any particular ECU supports the DID; support is runtime evidence."

  - id: uds.f181.application_software_identification
    semantic: ecu.application_software_identification
    version: 1
    description: Application Software Identification
    operation: { type: uds.read_data_by_identifier, identifier: "0xF181" }
    response: { positive_service: "0x62", identifier_echo: true }
    decoder: { type: opaque_bytes }
    provenance: *iso14229
    hardware_validation: *standard_support

  - id: uds.f187.manufacturer_spare_part_number
    semantic: ecu.manufacturer_spare_part_number
    version: 1
    description: Vehicle Manufacturer Spare Part Number
    operation: { type: uds.read_data_by_identifier, identifier: "0xF187" }
    response: { positive_service: "0x62", identifier_echo: true }
    decoder: { type: opaque_bytes }
    provenance: *iso14229
    hardware_validation: *standard_support

  - id: uds.f188.manufacturer_software_number
    semantic: ecu.manufacturer_software_number
    version: 1
    description: Vehicle Manufacturer ECU Software Number
    operation: { type: uds.read_data_by_identifier, identifier: "0xF188" }
