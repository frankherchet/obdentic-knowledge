schema_version: 2
namespace: manufacturers.vag.ea189_engine
description: >-
  EA189 engine read-only DID candidates (UDS ReadDataByIdentifier to the engine ECU, target role engine,
  see ecu-targets.yaml) that the source reads without a session change. Every entry is a candidate
  definition, not validated on hardware. Group = third segment of the definition id (vag.ea189.<group>.<name>).
  Applicability is a draft: vehicle manufacturer and engine role only, because EA189 engine identification
  predicates (F187/F189) need real evidence (obdentic #85). Plausible ranges are coarse sanity bounds, not decode evidence.
  Provenance cites only the archive version and entry count.

definitions:
  - id: vag.ea189.air.charge_limit_overcharge
    semantic: air.charge_limit_overcharge
    version: 1
    description: >-
      Charge limit for over-charge.
    applicability:
      kind: ecu_fingerprint
      predicates:
        - { field: vehicle.manufacturer, equals: vag }
        - { field: ecu.logical_role, equals: engine }
      provenance:
        classification: INFERRED
        confidence: low
        sources:
          - kind: research
            citation: "Engine ECU only; the EA189 engine identification predicates are pending real F187/F189 evidence (obdentic #85)."
    operation:
      type: uds.read_data_by_identifier
      identifier: "0x1356"
      ecu_role: engine
    response:
      positive_service: "0x62"
      identifier_echo: true
      exact_payload_length: 2
    decoder:
      type: linear_integer
      width_bytes: 2
      endian: big
      signed: true
      scale: 0.01
      offset: 0
    unit: "g"
    provenance:
      classification: COMMUNITY
      confidence: low
      sources:
        - kind: community
          citation: "locally extracted Car Scanner 2.1.50 EA189 profile (private), 124 entries"
    hardware_validation:
      status: not_validated
