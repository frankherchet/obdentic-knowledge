schema_version: 2
namespace: manufacturers.vag.ea189_engine_session_candidates
description: >-
  EA189 engine DID candidates whose source marks an extended session as a setup step. Whether they answer in
  the default session is unverified. These are NOT part of normal polling: consumers must treat every
  definition in this file (ids vag.ea189_session.<group>.<name>) as session_requirement unverified_default and
  may only try them in a closed learning run without session change. Kept separate because schema v2
  has no session field and the definition schema stays unchanged.
  Applicability is a draft, see ea189-engine.yaml.

definitions:
  - id: vag.ea189_session.air.intercooler_outlet_temperature
    semantic: air.intercooler_outlet_temperature
    version: 1
    description: >-
      Intercooler air outlet temperature.
    applicability:
      kind: ecu_fingerprint
      predicates:
        - { field: vehicle.manufacturer, equals: vag }
        - { field: ecu.logical_role, equals: engine }
      provenance:
        classification: INFERRED
        confidence: low
        sources:
          - kind: research
            citation: "Engine ECU only; the EA189 engine identification predicates are pending real F187/F189 evidence (obdentic #85)."
    operation:
      type: uds.read_data_by_identifier
      identifier: "0x1628"
      ecu_role: engine
    response:
      positive_service: "0x62"
      identifier_echo: true
      exact_payload_length: 2
    decoder:
      type: linear_integer
      width_bytes: 2
      endian: big
      signed: false
      scale: 0.1
      offset: -273.1
    unit: "°C"
    plausible_range:
      minimum: -60
      maximum: 300
    provenance:
      classification: COMMUNITY
      confidence: low
      sources:
        - kind: community
          citation: "locally extracted Car Scanner 2.1.50 EA189 profile (private), 124 entries"
    hardware_validation:
      status: not_validated
    notes: >-
      Source marks this read as needing an extended session. Session behaviour is unverified: it has not been tried in the default session. Do not poll it in normal profiles; only a closed learning run may try it without a session change.
